name: Bug report
description: Report a broken link or app behaviour.
body:
  - type: textarea
    id: problem
    attributes:
      label: What went wrong?
      description: Include the page, expected behaviour and steps to reproduce. Do not include student IDs, credentials or private newsletters.
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and browser
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or further details
